<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OOP</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-secondary">
    <main>
      <div class="container">
        <div class="row justify-content-center mt-5">
          <div class="col col-md-4">
            <h1>PET FORM</h1>
          </div>
        </div>
        <div class="row justify-content-center mt-5">
          <div class="col col-md-4">
            <form>
              <div class="mb-3">
                <label for="petName" class="form-label fw-bold">Pet Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="petName"
                  placeholder="Lola"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="ownerName" class="form-label fw-bold"
                  >Owner Name</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="ownerName"
                  placeholder="Mario"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="species" class="form-label fw-bold">Species</label>
                <input
                  type="text"
                  class="form-control"
                  id="species"
                  placeholder="Dog"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="breed" class="form-label fw-bold">Breed</label>
                <input
                  type="text"
                  class="form-control"
                  id="breed"
                  placeholder="Labrador"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary">Submit</button>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./script/script.js"></script>
  </body>
</html>
